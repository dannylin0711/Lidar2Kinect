# Lidar2Kinect (iOS / iPadOS universal app) - xcodegen project spec.
#   cd ios && xcodegen generate      -> Lidar2Kinect.xcodeproj (tracked in git, regenerate after editing this file)
# App/Info.plist is generated from the `info` section below.
name: Lidar2Kinect

options:
  createIntermediateGroups: true
  defaultConfig: Debug
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "10"

# The Swift package at the repository root: L2KShared (the portable C library in ../shared) and L2KKit (../ios/Sources).
packages:
  Lidar2Kinect:
    path: ..

targets:
  Lidar2Kinect:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lidar2Kinect
        CFBundleName: Lidar2Kinect
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Lidar2Kinect tracks your body with the camera and LiDAR and sends it to your PC or game as Kinect data.
        NSLocalNetworkUsageDescription: Lidar2Kinect sends the tracking data to the receiver on your local network.
        NSBonjourServices:
          - _l2k._udp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: Lidar2Kinect
        product: L2KKit
      - package: Lidar2Kinect
        product: L2KShared

schemes:
  Lidar2Kinect:
    build:
      targets:
        Lidar2Kinect: all
    run:
      config: Debug
      commandLineArguments:
        "-l2kSource synthetic": false
        "-l2kHost 127.0.0.1 -l2kAutoConnect 1": false
    profile:
      config: Release
    archive:
      config: Release
